<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff0f6"><title>한영 번역기</title>
<style>
:root{color-scheme:dark;--bg:#0d1017;--panel:#171c27;--line:#2a3242;--muted:#929caf;--text:#f4f6fb;--accent:#8b9cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#27304b 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif;min-height:100vh;padding:32px 16px}
main{max-width:960px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-size:21px;font-weight:750;letter-spacing:-.6px}.tag{color:var(--muted);font-size:12px}
h1{font-size:clamp(28px,5vw,42px);letter-spacing:-1.5px;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 28px}
.toolbar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}.lang{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 18px;font-weight:650;min-width:125px}.swap{border:1px solid var(--line);background:#222a3a;color:var(--accent);border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pane{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:300px}.panehead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.pane textarea{width:100%;height:220px;resize:vertical;background:transparent;border:0;outline:0;color:var(--text);padding:18px;font:18px/1.6 inherit}.pane textarea::placeholder{color:#657086}.foot{display:flex;justify-content:space-between;padding:0 18px 14px;color:var(--muted);font-size:12px}.actions{display:flex;gap:10px;align-items:center;margin:16px 0 26px}.primary,.secondary{border:0;border-radius:12px;padding:13px 20px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#10131b;flex:1}.secondary{background:#242c3b;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.55;cursor:wait}.note{color:var(--muted);font-size:12px;text-align:center}.history{margin-top:28px}.history h2{font-size:15px}.item{padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#cbd2df}.error{color:#ff9c9c;font-size:13px;min-height:20px}
@media(max-width:650px){body{padding:22px 12px}.grid{grid-template-columns:1fr}.pane{min-height:230px}.pane textarea{height:155px}.toolbar{gap:7px}.lang{min-width:0;flex:1;padding:11px 8px}.swap{flex:none}.actions{flex-wrap:wrap}.primary{flex-basis:100%}}

/* Pink refresh */
:root{color-scheme:light;--bg:#fff0f6;--panel:#fffafd;--line:#f5c8dc;--muted:#a45f7e;--text:#51243a;--accent:#ff4f9a}
body{background:radial-gradient(ellipse at 50% -20%,#ffc1dc 0,transparent 58%),linear-gradient(135deg,#fff0f6 0%,#ffe3ef 48%,#fff5fa 100%);color:var(--text)}
.brand{color:#e83283}
.tag{color:#b45d83}
.sub{color:#a45f7e}
.lang{background:#fffafd;border-color:#f2bfd6;color:#71334f;box-shadow:0 3px 12px #d94f8b12}
.swap{background:#ffe0ee;border-color:#f4b5d1;color:#e83283}
.pane{background:rgba(255,250,253,.94);border-color:#f3c3d9;box-shadow:0 10px 30px #b93d7510}
.panehead{border-color:#f5d4e3;color:#a45f7e}
.pane textarea{color:#51243a}
.pane textarea::placeholder{color:#c18aa4}
.primary{background:linear-gradient(135deg,#ff5ba4,#f02e87);color:white;box-shadow:0 7px 18px #ed3d8b38}
.secondary{background:#ffe5f0;color:#a52d68;border-color:#f3bfd5}
.item{background:#fffafd;border-color:#f3c3d9;color:#71334f}
.error{color:#d52f70}
.note{color:#a45f7e}
.history h2{color:#71334f}

</style></head>
<body><main>
<div class="top"><div class="brand">◈ WORDWAVE</div><div class="tag">FREE KOREAN ↔ ENGLISH</div></div>
<h1>말의 경계를 넘어</h1><p class="sub">한국어와 영어를 빠르고 간편하게 번역하세요.</p>
<div class="toolbar"><select class="lang" id="source"><option value="ko">한국어</option><option value="en">영어</option></select><button class="swap" id="swap" title="언어 전환">⇄</button><select class="lang" id="target"><option value="en">영어</option><option value="ko">한국어</option></select></div>
<div class="grid">
<section class="pane"><div class="panehead"><span id="sourceLabel">한국어</span><span>입력</span></div><textarea id="input" placeholder="번역할 내용을 입력하세요..." maxlength="5000"></textarea><div class="foot"><span>최대 5,000자</span><span id="count">0 / 5,000</span></div></section>
<section class="pane"><div class="panehead"><span id="targetLabel">영어</span><span>번역 결과</span></div><textarea id="output" placeholder="번역 결과가 여기에 표시됩니다." readonly></textarea><div class="foot"><span id="status">번역 대기 중</span><button class="secondary" id="copy" style="padding:4px 10px">복사</button></div></section>
</div>
<div class="actions"><button class="primary" id="translate">번역하기</button><button class="secondary" id="clear">초기화</button></div><div class="error" id="error" role="status"></div>
<div class="note">무료 번역 서비스(MyMemory)를 사용합니다. 번역을 요청하면 입력한 문장이 외부 번역 서비스로 전송됩니다.</div>
<section class="history" id="historyBox" hidden><h2>최근 번역</h2><div id="history"></div></section>
</main>
<script>
const $=id=>document.getElementById(id), source=$('source'),target=$('target'),input=$('input'),output=$('output');
function labels(){const a=source.value==='ko'?'한국어':'영어',b=target.value==='ko'?'한국어':'영어';$('sourceLabel').textContent=a;$('targetLabel').textContent=b}
function saveHistory(a,b){let h=[];try{h=JSON.parse(localStorage.getItem('ww-history')||'[]')}catch{}h.unshift({a,b});h=h.slice(0,6);localStorage.setItem('ww-history',JSON.stringify(h));renderHistory()}
function renderHistory(){let h=[];try{h=JSON.parse(localStorage.getItem('ww-history')||'[]')}catch{}$('historyBox').hidden=!h.length;$('history').innerHTML='';h.forEach(x=>{let d=document.createElement('div');d.className='item';d.textContent=x.a+' → '+x.b;d.title=x.a;d.onclick=()=>{input.value=x.a;output.value=x.b;count()};$('history').append(d)})}
function count(){$('count').textContent=input.value.length.toLocaleString()+' / 5,000'}
$('swap').onclick=()=>{let v=source.value;source.value=target.value;target.value=v;let t=input.value;input.value=output.value;output.value=t;labels();count()}
source.onchange=target.onchange=labels;input.oninput=count;
$('clear').onclick=()=>{input.value='';output.value='';$('error').textContent='';$('status').textContent='번역 대기 중';count()}
$('copy').onclick=async()=>{if(!output.value)return;try{await navigator.clipboard.writeText(output.value);$('status').textContent='복사 완료'}catch{$('error').textContent='복사 권한이 없습니다. 결과를 길게 눌러 복사해 주세요.'}}
$('translate').onclick=async()=>{const q=input.value.trim();$('error').textContent='';if(!q){$('error').textContent='번역할 내용을 입력해 주세요.';return}const btn=$('translate');btn.disabled=true;btn.textContent='번역 중...';$('status').textContent='번역 요청 중';try{const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+source.value+'|'+target.value;const r=await fetch(url);if(!r.ok)throw Error('서버 응답 오류');const data=await r.json();if(data.responseStatus!==200)throw Error(data.responseDetails||'번역에 실패했습니다.');output.value=data.responseData.translatedText||'';if(!output.value)throw Error('번역 결과가 비어 있습니다.');$('status').textContent='번역 완료';saveHistory(q,output.value)}catch(e){$('status').textContent='번역 실패';$('error').textContent=e.message==='Failed to fetch'?'네트워크 또는 무료 번역 서비스 연결을 확인해 주세요.':e.message}finally{btn.disabled=false;btn.textContent='번역하기'}};
labels();count();renderHistory();
</script></body></html>
